{% extends "base.html" %}
{% block title %}Sign in · MY COLLECTIONS{% endblock %}
{% block content %}
<div class="login-wrap">
  <section class="login-card">
    <div class="eyebrow">MEMBER ACCESS</div>
    <h1>Welcome back.</h1>
    <p class="muted">Sign in to open your personal collection.</p>
    <form method="post" autocomplete="on">
      <label>Username</label>
      <input name="username" required maxlength="80" autocomplete="username" placeholder="Enter username">
      <label>Password</label>
      <input name="password" type="password" required autocomplete="current-password" placeholder="Enter password">
      <button class="button full" type="submit">Sign in <b>→</b></button>
    </form>
    <p class="small muted">Local cybersecurity training environment. Use only the lab accounts.</p>
  </section>
</div>
{% endblock %}
