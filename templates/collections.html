{% extends "base.html" %}
{% block content %}
<div class="page-head"><div class="eyebrow">YOUR LIBRARY</div><h1>Collections.</h1><p class="muted">Only records owned by your account are shown.</p></div>
<div class="collection-grid">
{% for item in items %}
  <article class="collection-card"><div class="eyebrow">{{ item.category }}</div><h3>{{ item.title }}</h3><p>{{ item.description }}</p></article>
{% else %}
  <p class="muted">No collections yet.</p>
{% endfor %}
</div>
{% endblock %}
